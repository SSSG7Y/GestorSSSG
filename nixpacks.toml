[phases.setup]
nixPkgs = ["nodejs_20", "php83", "php83Extensions.bcmath", "php83Extensions.ctype", "php83Extensions.fileinfo", "php83Extensions.mbstring", "php83Extensions.pdo", "php83Extensions.pdo_pgsql", "php83Extensions.dom", "php83Extensions.xml", "php83Extensions.zip"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT" 